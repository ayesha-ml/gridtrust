name: GRIDTRUST Forecast Pipeline

on:
  workflow_dispatch:

  schedule:
    # Runs every day at 06:00 UTC (11:00 PKT)
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  forecast:
    name: Run Forecast Pipeline

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run GRIDTRUST Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          python -m src.automation.pipeline

      - name: Commit Updated Forecasts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add outputs/

          if git diff --cached --quiet; then
            echo "No forecast changes detected."
          else
            git commit -m "chore: update daily forecasts"
          fi

      - name: Push Changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
